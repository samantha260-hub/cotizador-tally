<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tally — Cotizador / Quoter / 报价工具 / 견적 도구</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,900&family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --violet:#6047FF; --violet-dark:#4a35d6; --cream:#FEFCF8; --ink:#1c1830;
    --orange:#FF8248; --cyan:#5ED7FF; --green:#49D475; --line:#e8e2f8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans','Noto Sans SC','Noto Sans KR',system-ui,sans-serif;background:var(--cream);color:var(--ink);font-size:15px}
  .wrap{max-width:1100px;margin:0 auto;padding:28px 20px 80px}
  header.app{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;gap:14px;flex-wrap:wrap}
  header.app img{height:44px}
  header.app .tag{background:var(--violet);color:#fff;padding:6px 14px;border-radius:20px;font-weight:700;font-size:13px}
  .langbox{display:flex;align-items:center;gap:8px}
  .langbox select{width:auto;font-weight:700}
  h2{font-size:16px;font-weight:700;margin-bottom:12px;color:var(--violet-dark)}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:20px;box-shadow:0 1px 4px rgba(96,71,255,.05)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
  label{display:block;font-size:12px;font-weight:700;margin-bottom:4px;color:#6b648a}
  input,select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:14px;background:#fff;color:var(--ink)}
  .grid input,.grid select{width:100%}
  input:focus,select:focus{outline:2px solid var(--violet);border-color:var(--violet)}
  table{width:100%;border-collapse:collapse}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#6b648a;text-align:left;padding:8px 10px;border-bottom:2px solid var(--line)}
  td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:none}
  .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  .btn{background:var(--violet);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer}
  .btn:hover{background:var(--violet-dark)}
  .btn.ghost{background:#fff;color:var(--violet);border:1.5px solid var(--violet)}
  .btn.small{padding:5px 10px;font-size:12px}
  .btn.orange{background:var(--orange)}
  .btn.orange:hover{background:#e96e35}
  .pill{display:inline-block;font-size:10.5px;font-weight:700;border-radius:20px;padding:2px 8px;margin-left:6px;vertical-align:middle}
  .pill.mes{background:#eef9f1;color:#1e9c4d}
  .pill.gov{background:#fff1e9;color:#d15a1e}
  .muted{color:#8a84a6;font-size:12px}
  .name{font-weight:700}
  .desc{font-size:12px;color:#6b648a;margin-top:2px;max-width:520px}
  .totline{display:flex;justify-content:space-between;padding:7px 4px;font-size:14.5px}
  .totline.big{font-size:19px;font-weight:900;border-top:2px solid var(--ink);margin-top:6px;padding-top:12px}
  .totline .lbl{color:#55507a}
  .disc-note{background:#f4f1ff;border:1px dashed var(--violet);border-radius:10px;padding:10px 14px;font-size:13px;margin:10px 0}
  .flex{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .right{margin-left:auto}
  .qty{width:64px !important;text-align:center}
  .del{background:none;border:none;color:#c33;cursor:pointer;font-size:16px}
  .catalog-row:hover{background:#faf8ff}
  #manualDiscBox{display:none}
  .warn{color:#d15a1e;font-size:12.5px;font-weight:700}
  footer.app{margin-top:30px;font-size:12px;color:#8a84a6;text-align:center}
  /* ---------- PRINT ---------- */
  #printDoc{display:none}
  @media print{
    body{background:#fff}
    .no-print{display:none !important}
    #printDoc{display:block;font-size:12.5px}
    @page{margin:16mm 14mm}
    #printDoc header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--violet);padding-bottom:12px;margin-bottom:16px}
    #printDoc header img{height:38px}
    #printDoc h1{font-size:20px;color:var(--violet);margin-bottom:2px}
    #printDoc .meta{font-size:11.5px;color:#555;text-align:right}
    #printDoc table{margin:10px 0}
    #printDoc th{border-bottom:1.5px solid var(--violet);color:var(--violet-dark)}
    #printDoc td{padding:6px 8px;font-size:11.5px}
    #printDoc .sec{font-weight:900;color:var(--violet-dark);margin:14px 0 4px;font-size:13px}
    #printDoc .totbox{margin-left:auto;width:340px;margin-top:8px}
    #printDoc .fine{font-size:10px;color:#777;margin-top:18px;line-height:1.5}
  }
</style>
</head>

  name:{es:'Alta de unidad de tecnovigilancia y mantenimiento de SGC',en:'Technovigilance Unit registration and QMS maintenance',zh:'器械警戒部门注册及质量体系维护',ko:'기술감시 부서 등록 및 QMS 유지'},
  note:{es:'Requisito para registro sanitario de dispositivos médicos.',en:'Required for medical device registration in Mexico.',zh:'墨西哥医疗器械注册的必要条件。',ko:'멕시코 의료기기 등록의 필수 요건입니다.'}},
];

/* ============ STATE & HELPERS ============ */
let LANG='es';
let items=[]; // {id, qty, price}
const usd=v=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(v);
const mxn=v=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(v)+' MXN';
const $=id=>document.getElementById(id);
const t=()=>T[LANG];

function tierDiscount(n){ if(n>20) return .20; if(n>=15) return .10; if(n>=10) return .05; return 0; }

function setLang(l){
  LANG=l;
  const x=t();
  document.documentElement.lang=l;
  $('hTag').textContent=x.tag;
  $('hClient').textContent=x.client;
  $('lCompany').textContent=x.company; $('cliente').placeholder=x.companyPh;
  $('lContact').textContent=x.contact; $('contacto').placeholder=x.contactPh;
  $('lQuoteNo').textContent=x.quoteNo; $('lDate').textContent=x.date;
  $('lClass').textContent=x.classif; $('lSkus').textContent=x.skus;
  // classification select (keep selection)
  const cur=$('clasif').value;
  $('clasif').innerHTML=`<option value="">${x.allClass}</option>`+CLASSES.map(c=>`<option value="${c.k}">${c[l]} (${x.pGroup[c.g]})</option>`).join('');
  $('clasif').value=cur;
  $('hCatalog').textContent=x.catalog; $('hCatalogNote').textContent=x.catalogNote;
  $('thService').textContent=x.service; $('thFees').textContent=x.fees; $('thGov').textContent=x.gov;
  $('hQuote').textContent=x.quote;
  $('thService2').textContent=x.service; $('thQty').textContent=x.qty; $('thUnit').textContent=x.unit;
  $('thFees2').textContent=x.feesCol; $('thGov2').textContent=x.gov;
  $('emptyMsg').textContent=x.empty;
  $('improveBtn').textContent=x.improve;
  $('lManual').textContent=x.manual; $('lMax').textContent=x.max; $('lTc').textContent=x.tc;
  $('lOnce').textContent=x.once; $('lMonthly').textContent=x.monthly; $('lDisc').textContent=x.disc;
  $('lAfter').textContent=x.after; $('lIva').textContent=x.iva; $('lGov').textContent=x.govTot; $('lTotal').textContent=x.total; $('lMxn').textContent=x.mxn;
  $('footNote').textContent=x.foot;
  $('btnClear').textContent=x.clear; $('btnPDF').textContent=x.pdf; $('lPdfLang').textContent=x.pdfLang;
  $('hFooter').textContent=x.footer;
  $('pdfLang').value=l;
  render();
}

function renderCatalog(){
  const cls=$('clasif').value, x=t();
  const tb=document.querySelector('#catalog tbody'); tb.innerHTML='';
  CATALOG.filter(p=>!cls||p.ap.includes(cls)).forEach(p=>{
    const tr=document.createElement('tr'); tr.className='catalog-row';
    tr.innerHTML=`<td><span class="name">${p.name[LANG]}</span>${p.monthly?`<span class="pill mes">${x.monthlyPill}</span>`:''}${p.gov?`<span class="pill gov">${x.govPill}</span>`:''}${p.note[LANG]?`<div class="desc">${p.note[LANG]}</div>`:''}</td>
      <td class="num">${usd(p.fee)}${p.monthly?`<span class="muted">${x.perMo}</span>`:''}</td>
      <td class="num">${p.gov?usd(p.gov):'—'}</td>
      <td class="num"><button class="btn small" onclick="addItem('${p.id}')">${x.add}</button></td>`;
    tb.appendChild(tr);
  });
}

function addItem(id){
  const ex=items.find(i=>i.id===id);
  if(ex){ex.qty++;} else {const p=CATALOG.find(c=>c.id===id); items.push({id,qty:1,price:p.fee});}
  render();
}
function delItem(idx){ items.splice(idx,1); render(); }
function setQty(idx,v){ items[idx].qty=Math.max(1,parseInt(v)||1); render(); }
function setPrice(idx,v){ items[idx].price=Math.max(0,parseFloat(v)||0); render(); }
function toggleManual(){ const b=$('manualDiscBox'); b.style.display=b.style.display==='inline'?'none':'inline'; if(b.style.display==='none'){$('manualDisc').value=0;} render(); }

function compute(){
  const skus=parseInt($('skus').value)||1;
  let once=0, monthly=0, gov=0;
  items.forEach(it=>{
    const p=CATALOG.find(c=>c.id===it.id);
    const line=it.price*it.qty;
    if(p.monthly) monthly+=line; else once+=line;
    gov+=p.gov*it.qty;
  });
  const tier=tierDiscount(skus);
  let manual=0;
  const manualActive=$('manualDiscBox').style.display==='inline';
  if(manualActive){
    manual=Math.min(20,Math.max(0,parseFloat($('manualDisc').value)||0))/100;
  }
  const rate=(manualActive&&manual>0)?manual:tier; // el ajuste manual sustituye al automático
  const fees=once+monthly;      // subtotal de honorarios (sin IVA)
  const disc=fees*rate;         // descuento sobre el subtotal
  const after=fees-disc;        // subtotal con descuento
  const iva=after*0.16;         // IVA 16% calculado después del descuento
  return {skus,once,monthly,gov,rate,tier,disc,after,iva,total:after+iva+gov};
}

function render(){
  renderCatalog();
  const x=t();
  const tb=document.querySelector('#quote tbody'); tb.innerHTML='';
  items.forEach((it,idx)=>{
    const p=CATALOG.find(c=>c.id===it.id);
    const tr=document.createElement('tr');
    tr.innerHTML=`<td><span class="name">${p.name[LANG]}</span>${p.monthly?`<span class="pill mes">${x.monthlyPill}</span>`:''}</td>
      <td><input class="qty" type="number" min="1" value="${it.qty}" onchange="setQty(${idx},this.value)"></td>
      <td class="num"><input class="qty" style="width:100px !important;text-align:right" type="number" step="0.01" value="${it.price.toFixed(2)}" onchange="setPrice(${idx},this.value)"></td>
      <td class="num">${usd(it.price*it.qty)}${p.monthly?`<span class="muted">${x.perMo}</span>`:''}</td>
      <td class="num">${p.gov?usd(p.gov*it.qty):'—'}</td>
      <td><button class="del" onclick="delItem(${idx})">✕</button></td>`;
    tb.appendChild(tr);
  });
  $('emptyMsg').style.display=items.length?'none':'block';

  const c=compute();
  const info=$('discountInfo');
  const manualActive=$('manualDiscBox').style.display==='inline';
  if(c.tier>0){
    info.innerHTML=x.discApplied((c.tier*100).toFixed(0),c.skus)+((manualActive&&c.rate!==c.tier)?x.manualOverride((c.rate*100).toFixed(1)):'');
  }else{
    info.innerHTML=x.noDisc(c.skus)+(c.rate>0?x.manualAuth((c.rate*100).toFixed(1)):'');
  }
  $('improveBtn').style.display=items.length?'inline-block':'none';
  $('tOnce').textContent=usd(c.once);
  $('tMonthly').textContent=c.monthly?usd(c.monthly)+' '+x.perMo:usd(0);
  $('discLine').style.display=c.rate>0?'flex':'none';
  $('discPct').textContent=(c.rate*100).toFixed(0)+'%';
  $('tDisc').textContent='− '+usd(c.disc);
  $('tAfter').textContent=usd(c.after);
  $('tIva').textContent=usd(c.iva);
  $('tGov').textContent=usd(c.gov);
  $('tTotal').textContent=usd(c.total);
  const tc=parseFloat($('tc').value)||18;
  $('tMXN').textContent=mxn(c.total*tc);
}

function genPDF(){
  const x=t();
  if(!items.length){alert(x.alertAdd);return;}
  const pl=$('pdfLang').value;           // PDF language (can differ from UI)
  const px=T[pl];
  const c=compute();
  const tc=parseFloat($('tc').value)||18;
  const logo=document.querySelector('header.app img').src;
  const fecha=($('fecha').value?new Date($('fecha').value+'T12:00:00'):new Date()).toLocaleDateString(px.locale,{day:'numeric',month:'long',year:'numeric'});
  const rows=(list)=>list.map(it=>{
    const p=CATALOG.find(y=>y.id===it.id);
    return `<tr><td>${p.name[pl]}${p.monthly?` <i>${px.monthlyCost}</i>`:''}</td><td class="num">${it.qty}</td><td class="num">${usd(it.price)}</td><td class="num">${usd(it.price*it.qty)}${p.monthly?px.perMo:''}</td><td class="num">${p.gov?usd(p.gov*it.qty):'—'}</td></tr>`;
  }).join('');
  const head=`<tr><th>${px.service}</th><th class="num">${px.qty}</th><th class="num">${px.unit}</th><th class="num">${px.feesCol}</th><th class="num">${px.gov}</th></tr>`;
  const onceItems=items.filter(i=>!CATALOG.find(cc=>cc.id===i.id).monthly);
  const mesItems=items.filter(i=>CATALOG.find(cc=>cc.id===i.id).monthly);
  $('printDoc').innerHTML=`
    <header>
      <div><img src="${logo}" alt="Tally"><h1 style="margin-top:10px">${px.docTitle}</h1>
      <div style="font-size:12px;color:#555">${$('cliente').value?`<b>${px.pClient}:</b> `+$('cliente').value:''} ${$('contacto').value?` · <b>${px.pContact}:</b> `+$('contacto').value:''}</div></div>
      <div class="meta"><b>${$('folio').value}</b><br>${fecha}<br>${px.pCurrency}<br>${px.pNo}: ${c.skus}</div>
    </header>
    ${onceItems.length?`<div class="sec">${px.secOnce}</div>
    <table><thead>${head}</thead><tbody>${rows(onceItems)}</tbody></table>`:''}
    ${mesItems.length?`<div class="sec">${px.secMonthly}</div>
    <table><thead>${head}</thead><tbody>${rows(mesItems)}</tbody></table>`:''}
    <div class="totbox">
      <div class="totline"><span class="lbl">${px.pOnce}</span><span class="num">${usd(c.once)}</span></div>
      ${c.monthly?`<div class="totline"><span class="lbl">${px.pMonthly}</span><span class="num">${usd(c.monthly)} ${px.perMo}</span></div>`:''}
      ${c.rate>0?`<div class="totline" style="color:#1e9c4d"><span class="lbl">${px.disc} ${(c.rate*100).toFixed(0)}%</span><span class="num">− ${usd(c.disc)}</span></div>`:''}
      <div class="totline"><span class="lbl">${px.pAfter}</span><span class="num">${usd(c.after)}</span></div>
      <div class="totline"><span class="lbl">${px.iva}</span><span class="num">${usd(c.iva)}</span></div>
      <div class="totline"><span class="lbl">${px.pGov}</span><span class="num">${usd(c.gov)}</span></div>
      <div class="totline big"><span>${px.pTotal}</span><span class="num">${usd(c.total)}</span></div>
      <div class="totline"><span class="lbl">${px.pMxn(tc)}</span><span class="num">${mxn(c.total*tc)}</span></div>
    </div>
    <div class="fine">${px.fine(tc)}</div>`;
  window.print();
}

function resetAll(){
  if(items.length&&!confirm(t().confirmClear))return;
  items=[]; $('manualDisc').value=0; $('manualDiscBox').style.display='none'; render();
}

/* init */
(function(){
  const d=new Date();
  $('fecha').value=d.toISOString().slice(0,10);
  $('folio').value='TLY-'+d.toISOString().slice(0,10).replace(/-/g,'')+'-01';
  $('clasif').addEventListener('change',render);
  $('skus').addEventListener('input',render);
  setLang('es');
})();
</script>
</body>
</html>
